name: Calling reusable build and deploy with secret

on:
  workflow_dispatch:
    inputs:
      node-version:
        description: Node.js version
        required: false
        default: '20'
      working-directory:
        description: Application directory
        required: false
        default: './app'
  

jobs:
  application-ci:
    uses: ./.github/workflows/reusable-workflow.yml
    with:
      node-version: ${{ github.event.inputs.node-version }}
      working-directory: ${{ github.event.inputs.working-directory }}
  deploy:
    needs: application-ci
    uses: ./.github/workflows/reusable-deploy.yml
    secrets: 
       secret_for_deploy: ${{ secrets.SECRET_FROM_REPO }}
     
