name: Application CI Buil and Deploy

on:
  workflow_dispatch:
    inputs:
      node-version:
        description: Node.js version
        required: false
        default: '20'
      working-directory:
        description: Application directory
        required: false
        default: './app'
jobs:
  application-ci:
    uses: "./.github/workflows/reusable-workflow.yml"
    with:
      node-version: ${{ github.event.inputs.node-version }}
      working-directory: ${{ github.event.inputs.working-directory }}
  deploy:
    needs: application-ci
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifatct
        uses: actions/download-artifact@v4
        with:
          name: application-build
          path: downloaded-build
      - name: Verify downloaded build
        run: |
          echo "Downloaded build directory:"
          ls -R downloaded-build