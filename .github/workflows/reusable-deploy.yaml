name: Deploy reusable workflow

on:
  workflow_call:
    secrets:
      secret_for_deploy:
        required: true
        type: string


jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:

      - name: Download build artifact
       uses: actions/download-artifact@v4
       with:
         name: application-build
         path: downloaded_build 
      - name: Verify secret for deploy
        run: |
          echo "Secret for deploy: ${{ secrets.secret_for_deploy }}"
      - name: Verify downloaded build
        run: |
          echo "Downloaded build directory:"
          ls -R downloaded_build